# KataGo GTP 配置 —— 给 `katago.exe gtp` 用
#
# 为什么不用 analysis 引擎了：analysis 每次请求都是一个全新的局面，
# 引擎要从零把搜索树建起来，落一手就要重新算一遍（这台机器上要好几秒）。
# GTP + kata-analyze 是持续分析模式：落子只发一句 play，
# 引擎接着已有的搜索树往下算，所以落子几乎是立刻出新结果。

# ---- 规则（GTP 模式必须显式给，不从别处继承）----
koRule = SIMPLE
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonusRule = N-1

# ---- 日志 ----
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false
logAllRequests = false
logAllResponses = false

# ---- 搜索 ----
# 500 直接照艾姆西的 default_gtp.cfg。
# 之前我写 100000 等于不限：引擎会一直算到天荒地老，风扇停不下来，
# 而且并不会更准——500 visit 之后前几名基本不动了。
maxVisits = 500
numSearchThreads = 4
nnMaxBatchSize = 8
openclUseFP16 = auto
# 钉死在 MX250（设备 0）。换卡就改成对应编号或删掉这行
openclGpuToUse = 0

# ---- 分析输出 ----
# 胜率按"轮到谁"的视角给，界面上直接就是下棋方的胜率
reportAnalysisWinratesAs = SIDETOMOVE
analysisPVLen = 1
