# KataGo GTP 配置
#
# 以艾姆西的 default_gtp.cfg 为底（它的 18 项生效参数全部保留），
# 只改四处：
#   1. 关掉 GTP 流水日志（它默认全开，会把每句话都写进 gtp_logs\）
#   2. maxVisits 从 500 提到 2000，深度够复盘用
#   3. numSearchThreads 6 -> 4（MX250 上实测 4 更稳）
#   4. 规则按野狐来
#
# 教训：之前我把它精简成 36 行，还自己加了 nnMaxBatchSize / openclUseFP16 /
# openclGpuToUse 三项，结果引擎每 100ms 报一次、visits 却一直停在 1，
# 搜索根本没推进。参数不是越优化越好。

logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false

rules = chinese
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3

maxVisits = 2000
ponderingEnabled = false
maxTimePondering = 60.0
lagBuffer = 1.0
numSearchThreads = 4

searchFactorAfterOnePass = 0.50
searchFactorAfterTwoPass = 0.25
searchFactorWhenWinning = 0.40
searchFactorWhenWinningThreshold = 0.95

reportAnalysisWinratesAs = SIDETOMOVE
analysisPVLen = 1
