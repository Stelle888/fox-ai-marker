# KataGo GTP 配置
#
# 精简版。踩过的坑都记在这儿，别再走一遍：
#  1. 照搬艾姆西 default_gtp.cfg 的全部 18 项时，里头那组
#     searchFactorAfterOnePass / searchFactorAfterTwoPass /
#     searchFactorWhenWinning 会让搜索死死盯住第一名 ——
#     实测 12 秒里只有 1 个候选被访问过，界面上永远只有一颗点。
#     去掉这组，候选才铺得开。
#  2. 自己加 nnMaxBatchSize / openclUseFP16 / openclGpuToUse 会让引擎
#     每 100ms 报一次但 visits 卡在 1。也别加。
#  3. GTP 模式下 koRule / scoringRule 这些规则项必须显式写，缺了引擎直接退出。

koRule = SIMPLE
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonusRule = N-1

logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false

maxVisits = 2000
numSearchThreads = 4
ponderingEnabled = false
lagBuffer = 1.0

reportAnalysisWinratesAs = SIDETOMOVE
analysisPVLen = 1
