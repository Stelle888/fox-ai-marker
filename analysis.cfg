# KataGo analysis 引擎配置 —— 为"实时标注"调过：快出结果 > 极致精度
#
# 用法：katago.exe analysis -model <权重> -config 这个文件

# ---- 日志 ----
# 不写日志文件：免得项目目录里长出一堆 .log。引擎的报错走 stderr，程序自己会读。
logToStderr = false
logAllRequests = false
logAllResponses = false

# ---- 分析 ----
# 胜率按"轮到谁"的视角报（SIDETOMOVE），这样界面上直接就是下棋方的胜率
reportAnalysisWinratesAs = SIDETOMOVE
# 不摆变化图，给 1 步就够（要变化图的话改成 6）
analysisPVLen = 1
# 只要最优解，不要为了"多样性"故意分散搜索
wideRootNoise = 0.0
# 注意：中间结果回报频率（reportDuringSearchEvery）**不能**写在这里 ——
# analysis 引擎会把它当"未知配置项"忽略掉（启动日志里会有 WARNING: Unused key），
# 那样就得一直等到整个搜索结束才有结果，看起来像"卡住了"。
# 程序已经把它放进每个请求的 JSON 里了（见 foxwq_ai/engine.py）。

# ---- 并行 ----
# 同时最多算 2 个局面：新的一手落下来时，旧请求不会把新请求卡住
numAnalysisThreads = 2
# 每个局面用几个搜索线程（MX250 这种小卡，4 差不多）
numSearchThreadsPerAnalysisThread = 4
# 送进 GPU 的批大小
nnMaxBatchSize = 8
# 半精度：显卡支持就自动开
openclUseFP16 = auto
# 钉死在 MX250（设备 0）。如果以后换卡，改成对应编号或删掉这行
openclGpuToUse = 0

# ---- 用不上的功能，关掉省事 ----
# 规则在每次请求里给，这里只放默认
maxVisits = 200
